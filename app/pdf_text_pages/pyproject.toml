[project]
name = "pdf-text-pages"
version = "0.1.6"
requires-python = ">=3.12,<3.13"
dependencies = ["dify-plugin==0.10.2", "pypdfium2==5.14.0", "Pillow==12.3.0"]
[dependency-groups]
dev = ["pytest==9.0.3", "reportlab==4.4.10", "pip-audit==2.10.0", "ruff==0.15.15"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
